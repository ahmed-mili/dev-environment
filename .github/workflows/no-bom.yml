name: no-bom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject UTF-8 BOM in .ps1 files
        run: |
          set -e
          found=0
          while IFS= read -r f; do
            if head -c 3 "$f" | od -An -tx1 | tr -d ' \n' | grep -qi '^efbbbf'; then
              echo "::error file=$f::UTF-8 BOM detected at the start of $f"
              found=1
            fi
          done < <(git ls-files '*.ps1')
          if [ "$found" -ne 0 ]; then
            echo ""
            echo "A UTF-8 BOM at the start of a .ps1 file breaks 'iwr | iex'."
            echo "Strip it locally, e.g.:"
            echo "  pwsh -Command \"\$p='install.ps1'; \$b=[IO.File]::ReadAllBytes(\$p); if(\$b[0]-eq 0xEF){[IO.File]::WriteAllBytes(\$p,\$b[3..(\$b.Length-1)])}\""
            exit 1
          fi
          echo "OK: no BOM in any .ps1"

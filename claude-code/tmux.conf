# Truecolor (24-bit) passthrough.
#
# Cause this fixes: Claude Code emits 24-bit color (it reads COLORTERM=truecolor
# from ~/.bashrc), but tmux clamps it to its 256-color palette unless it knows the
# OUTER terminal is RGB-capable. Over mosh, COLORTERM is NOT propagated and the
# xterm-256color terminfo entry does not advertise RGB, so tmux saw the client as
# 256-color (RGB: [missing], Tc: [missing]) and quantized every gradient -> visible
# banding on the phone. Asserting RGB for every terminal makes tmux forward 24-bit
# untouched (Termux's terminal renders truecolor, so this is correct here).
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# PgUp/PgDn : PAS de binding tmux -> on laisse passer a Claude Code.
#
# Pourquoi pas `bind -n PageUp copy-mode -eu` (essaye et retire 2026-05-28) :
# Claude Code v2.1.18+ en fullscreen rendering (settings.json "tui":"fullscreen")
# active le contexte `Scroll` qui bind nativement PageUp -> scroll:pageUp /
# PageDown -> scroll:pageDown sur SON propre transcript. Si tmux capture la touche
# en amont, Claude la voit jamais et le transcript ne scrolle plus. Or copy-mode
# tmux sur l'alternate screen (= ce que Claude fullscreen utilise) montre une page
# vide -> on perdait sur les deux tableaux : tmux scrolle rien, Claude scrolle rien.
# Sans binding : PgUp/PgDn traversent tmux -> Claude scroll demi-page ; Ctrl+Home /
# Ctrl+End sautent au debut / a la fin (et reactivent l'auto-follow).
# Pour scroll l'historique tmux lui-meme : Prefix (Ctrl+B) puis PageUp (binding
# default `bind -T prefix PPage copy-mode -u`).
#
# Note : Pourquoi pas une regle conditionnelle `if -F '#{alternate_on}' ...` :
# trop fragile (mode alternate ON/OFF n'est pas un proxy fiable pour "claude
# fullscreen actif"). Le simple "pas de binding" est plus robuste.

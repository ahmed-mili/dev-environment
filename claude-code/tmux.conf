# Truecolor (24-bit) passthrough.
#
# Cause this fixes: Claude Code emits 24-bit color (it reads COLORTERM=truecolor
# from ~/.bashrc), but tmux clamps it to its 256-color palette unless it knows the
# OUTER terminal is RGB-capable. Over mosh, COLORTERM is NOT propagated and the
# xterm-256color terminfo entry does not advertise RGB, so tmux saw the client as
# 256-color (RGB: [missing], Tc: [missing]) and quantized every gradient -> visible
# banding on the phone. Asserting RGB for every terminal makes tmux forward 24-bit
# untouched (Termux's terminal renders truecolor, so this is correct here).
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# PgUp/PgDn : PAS de binding tmux -> on laisse passer a Claude Code.
#
# Pourquoi pas `bind -n PageUp copy-mode -eu` (essaye et retire 2026-05-28) :
# Claude Code v2.1.18+ en fullscreen rendering (settings.json "tui":"fullscreen")
# active le contexte `Scroll` qui bind nativement PageUp -> scroll:pageUp /
# PageDown -> scroll:pageDown sur SON propre transcript. Si tmux capture la touche
# en amont, Claude la voit jamais et le transcript ne scrolle plus. Or copy-mode
# tmux sur l'alternate screen (= ce que Claude fullscreen utilise) montre une page
# vide -> on perdait sur les deux tableaux : tmux scrolle rien, Claude scrolle rien.
# Sans binding : PgUp/PgDn traversent tmux -> Claude scroll demi-page ; Ctrl+Home /
# Ctrl+End sautent au debut / a la fin (et reactivent l'auto-follow).
# Pour scroll l'historique tmux lui-meme : Prefix (Ctrl+B) puis PageUp (binding
# default `bind -T prefix PPage copy-mode -u`).
#
# Note : Pourquoi pas une regle conditionnelle `if -F '#{alternate_on}' ...` :
# trop fragile (mode alternate ON/OFF n'est pas un proxy fiable pour "claude
# fullscreen actif"). Le simple "pas de binding" est plus robuste.

# Mouse mode : forward la molette / le swipe a l'app interne (Claude).
#
# Cible : sessions OU le terminal-client achemine les events souris -- PC local
# (Windows Terminal) ET phone via SSH classique (Termux bascule en mouse mode
# quand l'app demande mouse tracking via ESC[?1000h+1006h, et SSH forward).
# Sans `mouse on`, le terminal client convertit chaque cran / swipe en arrow
# keys -> Claude affiche "Scroll wheel is sending arrow keys".
#
# Sans effet pour le scenario phone via MOSH : mosh 1.4 n'achemine simplement
# pas les events souris (cf. reference_mosh-no-mouse-scroll). La ligne reste
# safe car aucun event n'arrive jusqu'a tmux. Le clavier (PgUp/PgDn extra-keys)
# demeure le seul chemin de scroll sur mosh, inchange.
#
# Effet de bord : drag-select avec souris passe par tmux au lieu du copy
# natif du terminal. Bypass = maintenir Shift pendant le drag.
set -g mouse on

# ── Status bar : theme « Minimal plat » (Tokyo Night) ──────────────────────
#
# Remplace le defaut tmux (fond vert plein + status-left-length 10 qui tronquait
# `[dev-environment] ` en `[dev-envir`, collant le nom de session a la liste des
# fenetres `0:claude*` -> faux nom illisible `dev-envir0:claude*`). Couleurs en
# truecolor 24-bit (autorise par terminal-features *:RGB tout en haut du fichier).
# Tout est derive dynamiquement (#S = session, #h = hostname) : aucune valeur
# perso en dur, le repo reste partageable.

# Barre de statut tmux MASQUEE : la statusline de Claude Code (chemin, branche
# git, modele, quotas, contexte) fait deja le job -> la barre tmux ferait doublon
# et collait visuellement a la statusline. Le theme ci-dessous reste entierement
# defini : repasser ce 'off' a 'on' suffit a la rallumer (pastille bleue, prefix,
# zoom, etc.) sans rien recoder.
set -g status off
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Fond + texte de base : gris tres fonce, plus aucun vert.
set -g status-style "bg=#16161e,fg=#a9b1d6"

# Gauche : pastille « session ». Longueur large => plus jamais tronque.
# Bonus tmux (absent de la statusline Claude Code) : la pastille vire au JAUNE
# quand le prefix (Ctrl+B) est actif -> on voit si tmux « ecoute » une touche.
set -g status-left-length 60
set -g status-left "#{?client_prefix,#[fg=#16161e#,bg=#e0af68#,bold],#[fg=#16161e#,bg=#7aa2f7#,bold]} #S #{?client_prefix,#[fg=#e0af68#,bg=#16161e#,nobold],#[fg=#7aa2f7#,bg=#16161e#,nobold]}  "

# Fenetres : active en bleu gras, inactives en gris, separateur 2 espaces.
# Bonus tmux (absent de la statusline Claude Code) : un « Z » jaune s'accole a la
# fenetre active quand un pane est zoome (Ctrl+B z) -> plus de « pourquoi mes
# autres panes ont disparu ».
set -g window-status-separator "  "
set -g window-status-format "#[fg=#565f89,bg=#16161e]#I:#W"
set -g window-status-current-format "#[fg=#7aa2f7,bg=#16161e,bold]#I:#W#[fg=#e0af68,nobold]#{?window_zoomed_flag, Z,}"
set -g window-status-activity-style "fg=#e0af68,bg=#16161e"
set -g window-status-bell-style "fg=#f7768e,bg=#16161e,bold"

# Droite : hostname + heure, discrets (pane_title retire -> plus epure).
set -g status-right-length 60
set -g status-right "#[fg=#565f89]#h #[fg=#414868]· #[fg=#a9b1d6]%H:%M "

# Bordures de volets + messages assortis a la palette.
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#16161e,bold"
set -g mode-style "bg=#283457,fg=#c0caf5"

# Truecolor (24-bit) passthrough.
#
# Cause this fixes: Claude Code emits 24-bit color (it reads COLORTERM=truecolor
# from ~/.bashrc), but tmux clamps it to its 256-color palette unless it knows the
# OUTER terminal is RGB-capable. Over mosh, COLORTERM is NOT propagated and the
# xterm-256color terminfo entry does not advertise RGB, so tmux saw the client as
# 256-color (RGB: [missing], Tc: [missing]) and quantized every gradient -> visible
# banding on the phone. Asserting RGB for every terminal makes tmux forward 24-bit
# untouched (Termux's terminal renders truecolor, so this is correct here).
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# PgUp/PgDn (extra-keys Termux via mosh) -> scroll du buffer tmux, pas navigation
# d'historique cote Claude. Sans ce binding, les touches traversent tmux et arrivent
# a Claude Code qui les traite comme fleches haut/bas (next/prev prompt) -> impossible
# de relire ce qui a scrolle au-dessus. -e = sortir de copy-mode en bas, -u = scroller
# d'une page a l'entree.
bind -n PageUp copy-mode -eu

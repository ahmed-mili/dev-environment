# Termux UI tweaks paired with the Catppuccin Mocha palette.
# Drop at ~/.termux/termux.properties then `termux-reload-settings`.

# Use the volume keys as Ctrl/Alt modifiers — useful for Claude Code and any
# REPL where Ctrl+C / Ctrl+R / Ctrl+T are required.
volume-keys = virtual

# Extra keys row: cover the modifiers + arrows + common Claude Code chords.
extra-keys = [['ESC','/','-','HOME','UP','END','PGUP'], \
              ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN']]

# Show the keyboard always — predictable for one-handed Claude prompts.
soft-keyboard-toggle-behaviour = enable/disable

# Cursor style — block matches Windows Terminal.
terminal-cursor-style = block

# Bell off — visual only, mobile context.
bell-character = ignore

# Default working directory: jump straight to ~/dev when you open Termux.
# (Bashrc also enforces this; doubling up here ensures even minimal shells start there.)
default-working-directory = /data/data/com.termux/files/home/dev

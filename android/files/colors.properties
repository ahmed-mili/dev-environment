# Catppuccin Mocha for Termux — true-black AMOLED variant
# Drop at ~/.termux/colors.properties then run `termux-reload-settings`
#
# background is forced to pure #000000 (vs Catppuccin's #1e1e2e): on AMOLED
# those sub-pixels are physically OFF -> less drain and no burn-in on the
# always-on tmux/statusline rows. foreground stays #cdd6f4 (off-white, not
# pure #fff) so pure black doesn't halate. Everything else = stock Mocha.

background=#000000
foreground=#cdd6f4
cursor=#f5e0dc

color0=#45475a
color1=#f38ba8
color2=#a6e3a1
color3=#f9e2af
color4=#89b4fa
color5=#f5c2e7
color6=#94e2d5
color7=#bac2de

color8=#585b70
color9=#f38ba8
color10=#a6e3a1
color11=#f9e2af
color12=#89b4fa
color13=#f5c2e7
color14=#94e2d5
color15=#a6adc8
